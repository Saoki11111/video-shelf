<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="旅の動画をまとめた個人用ビデオライブラリ">
    <title>旅の記憶 | Video Shelf</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" type="module"></script>
    <script src="js/map.js" type="module"></script>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Video Shelf">
    <meta property="og:title" content="旅の記憶 | Video Shelf">
    <meta property="og:description" content="旅の動画をまとめた個人用ビデオライブラリ">
    <meta property="og:url" content="https://video-shelf.pages.dev/">
    <meta property="og:image" content="https://video-shelf.pages.dev/images/ogp.jpg">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="トップへ">
        <img class="brand-mark" src="images/icon-map.png" alt="">
        <span>Video Shelf</span>
      </a>
      <nav class="site-nav" aria-label="ページ">
        <a href="index.html" aria-current="page">トップ</a>
        <a href="timeline.html">一覧</a>
        <a href="music.html">使用曲</a>
      </nav>
    </header>

    <main>
      <div class="site-concept">
        <p class="eyebrow">ABOUT VIDEO SHELF</p>
        <p>海外を中心に、旅先の景色と音を残す映像記録。</p>
      </div>

      <a class="interview-banner" href="interview.html">
        <span class="ib-faces" aria-hidden="true">
          <span style="background:#ffe9f0"><img src="images/animals/rabbit.png" alt=""></span>
          <span style="background:#fff3d9"><img src="images/animals/tiger.png" alt=""></span>
          <span style="background:#e3f2fd"><img src="images/animals/penguin.png" alt=""></span>
          <span style="background:#efe9fb"><img src="images/animals/owl.png" alt=""></span>
          <span style="background:#e9fbe9"><img src="images/animals/cat.png" alt=""></span>
        </span>
        <span class="ib-text"><strong>令和どうぶつたちが聞く、Video Shelf の話</strong><small>名前の由来から、動物の感想のことまで</small></span>
        <span class="ib-arrow" aria-hidden="true">→</span>
      </a>

      <section class="travel-map" aria-labelledby="travel-map-title">
        <div class="map-panel">
          <div class="map-head">
            <div>
              <p class="eyebrow">TRAVEL MAP</p>
              <h1 id="travel-map-title">旅の地図</h1>
              <p class="map-sub">アジア・太平洋エリア ― ピンから旅の動画へ</p>
              <p class="map-hint">ピンをタップすると動画を選択できます。ピンチで拡大、ドラッグで移動もできます。</p>
            </div>
            <a class="section-link" href="timeline.html">動画一覧 →</a>
          </div>
          <div class="map-wrap">
            <canvas id="travel-map-canvas" aria-label="アジア・太平洋エリアの旅行マップ"></canvas>
            <div id="pin-layer"></div>
            <button id="map-reset" class="map-reset" type="button" hidden>全体表示</button>
          </div>
          <div id="map-card" class="map-card" hidden>
            <img id="map-card-thumb" class="map-card-thumb" src="" alt="">
            <div class="map-card-body">
            <p id="map-card-title" class="map-card-title"></p>
            <a id="map-card-link" class="map-card-link" href="#">▶ 動画を見る</a>
            </div>
          </div>
          <div class="map-stats">
            <div class="map-stat"><b>6</b><span>国・地域</span></div>
            <div class="map-stat"><b>7</b><span>旅の記録</span></div>
            <div class="map-stat"><b>16,676</b><span>km の軌跡</span></div>
          </div>
        </div>
      </section>

      <div class="top-sections"></div>
    </main>

    <footer>Video Shelf · Personal Archive</footer>
</body>
</html>
