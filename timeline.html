<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="年代順の動画一覧">
    <title>一覧 | Video Shelf</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/timeline.js" type="module"></script>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Video Shelf">
    <meta property="og:title" content="一覧 | Video Shelf">
    <meta property="og:description" content="旅の動画をまとめた個人用ビデオライブラリ">
    <meta property="og:url" content="https://video-shelf.pages.dev/timeline">
    <meta property="og:image" content="https://video-shelf.pages.dev/images/ogp.jpg">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="トップへ">
        <img class="brand-mark" src="images/icon-map.png" alt="">
        <span>Video Shelf</span>
      </a>
      <nav class="site-nav" aria-label="ページ">
        <a href="index.html">トップ</a>
        <a href="timeline.html" aria-current="page">一覧</a>
        <a href="music.html">使用曲</a>
      </nav>
    </header>

    <main>
      <section id="hero-carousel" class="hero slide-0" aria-label="ピックアップ動画" aria-roledescription="カルーセル" role="link" tabindex="0">
        <img id="hero-thumbnail" class="hero-thumbnail" src="images/thumbnails/202603-hongkong.jpg" alt="" width="1280" height="720" decoding="sync" fetchpriority="high">
        <button id="carousel-prev" class="carousel-arrow carousel-prev" type="button" aria-label="前の動画"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 12h-16m0 0 6.5-6.5M4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="hero-content">
          <p id="hero-eyebrow" class="eyebrow">PICKUP</p>
          <h1 id="hero-title">旅の続きを、再生しよう。</h1>
          <p id="hero-description">旅先で残した景色を、いつでも気軽に。</p>
        </div>
        <p id="hero-number" class="hero-number" aria-hidden="true">01</p>
        <button id="carousel-next" class="carousel-arrow carousel-next" type="button" aria-label="次の動画"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 12h16m0 0-6.5-6.5m6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div id="carousel-dots" class="carousel-dots" aria-label="表示する動画を選ぶ"></div>
      </section>

      <div class="page-shell">
      <section class="page-intro">
        <p class="eyebrow">TIMELINE</p>
        <h1>一覧</h1>
        <p id="timeline-summary">場所で絞って、一覧で追えるページです。</p>
      </section>

      <div class="filter-row timeline-filter-row">
        <span class="filter-label">場所</span>
        <div class="tag-carousel">
          <button id="tag-carousel-prev" class="tag-carousel-navigation" type="button" aria-label="前の場所を見る"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div id="tag-filters" class="tag-filters" aria-label="場所で絞り込む"></div>
          <button id="tag-carousel-next" class="tag-carousel-navigation" type="button" aria-label="次の場所を見る"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>

      <div id="timeline" class="timeline"></div>
      <p id="timeline-empty" class="empty-state" hidden>動画データを読み込めませんでした。</p>
      </div>
    </main>

    <footer>Video Shelf · Personal Archive</footer>
</body>
</html>
