<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="動画詳細">
    <title>動画 | Video Shelf</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/video.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">VS</span>
        <span>Video Shelf</span>
      </a>
      <nav class="site-nav" aria-label="ページ">
        <a href="index.html">トップ</a>
        <a href="timeline.html">一覧</a>
        <a href="music.html">使用曲</a>
      </nav>
    </header>

    <main class="detail-page">
      <div class="detail-toolbar">
        <a class="back-link" href="timeline.html">← 一覧へ</a>
        <p class="save-hint">※ 保存は「︙」から</p>
      </div>
      <div id="detail" hidden>
        <div id="player" class="player"></div>
        <div class="detail-layout">
          <article>
            <div id="detail-tags" class="card-tags"></div>
            <h1 id="detail-title"></h1>
            <p id="detail-date" class="detail-date"></p>
            <p id="detail-description" class="detail-description"></p>
          </article>
        </div>
        <section id="music-section" class="music-section" hidden aria-labelledby="music-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">MUSIC</p>
              <h2 id="music-title">使用曲</h2>
            </div>
          </div>
          <div id="music-list" class="music-list"></div>
        </section>
        <section id="animal-section" class="animal-section" hidden aria-labelledby="animal-title">
          <div class="section-heading animal-heading">
            <div>
              <p class="eyebrow">AI FRIENDS</p>
              <h2 id="animal-title">AIどうぶつの紹介コメント</h2>
            </div>
            <button id="animal-shuffle" class="animal-shuffle" type="button">↻ シャッフル</button>
          </div>
          <div id="animal-list" class="animal-list"></div>
          <p class="animal-note">開くたびに3件ランダム表示 ／ ハートは押せます（自分の分はその場だけ、リロードでリセット）</p>
        </section>
        <section id="next-videos" class="next-videos" aria-labelledby="next-videos-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">UP NEXT</p>
              <h2 id="next-videos-title">次に見る</h2>
            </div>
          </div>
          <div class="next-videos-carousel">
            <div id="next-videos-grid" class="video-grid next-videos-grid"></div>
            <div class="next-videos-navigation" aria-label="次に見る動画を移動">
              <button id="next-videos-prev" type="button" aria-label="前の動画"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <button id="next-videos-next" type="button" aria-label="次の動画"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </div>
        </section>
      </div>
      <p id="error-state" class="empty-state" hidden>動画が見つかりません。</p>
    </main>

    <footer>Video Shelf · Personal Archive</footer>
</body>
</html>
